<!doctype html>
<html lang="en-us">
  <head>
    <title>Course | <%= process.env.SITE_NAME %></title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="<%=htmlWebpackPlugin.options.FAVICON_URL%>" type="image/x-icon" />
    <!-- EARLY ERROR LOGGING: Runs before any other JavaScript -->
    <script>
      (function() {
        'use strict';
        // Log that HTML is loading
        console.log('[JWT Auth] HTML page loading', {
          url: window.location.href,
          referrer: document.referrer,
          inIframe: window.self !== window.top,
          readyState: document.readyState,
          timestamp: new Date().toISOString()
        });

        // Set up error handlers IMMEDIATELY - before any other scripts load
        // This catches errors that occur during script loading/module initialization

        // Catch synchronous JavaScript errors
        window.onerror = function(message, source, lineno, colno, error) {
          console.error('[JWT Auth] Error (window.onerror):', {
            message: message,
            source: source,
            lineno: lineno,
            colno: colno,
            error: error ? {
              name: error.name,
              message: error.message,
              stack: error.stack
            } : null,
            url: window.location.href,
            referrer: document.referrer,
            inIframe: window.self !== window.top,
            timestamp: new Date().toISOString()
          });
          return false; // Don't prevent default error handling
        };

        // Catch unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
          var error = event.reason instanceof Error
            ? event.reason
            : new Error(String(event.reason));

          console.error('[JWT Auth] Error (unhandledrejection):', {
            message: error.message,
            name: error.name,
            stack: error.stack,
            reason: event.reason,
            url: window.location.href,
            referrer: document.referrer,
            inIframe: window.self !== window.top,
            timestamp: new Date().toISOString()
          });
        });

        // Catch resource loading errors (scripts, images, etc.)
        window.addEventListener('error', function(event) {
          // Only log resource errors (not JavaScript errors, which are handled by onerror)
          if (event.target !== window && event.target !== document) {
            console.error('[JWT Auth] Error (resource load):', {
              tagName: event.target.tagName,
              src: event.target.src || event.target.href,
              type: event.target.type,
              url: window.location.href,
              referrer: document.referrer,
              inIframe: window.self !== window.top,
              timestamp: new Date().toISOString()
            });
          }
        }, true); // Use capture phase

        // Log when DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            console.log('[JWT Auth] DOMContentLoaded fired', {
              url: window.location.href,
              hasRootElement: !!document.getElementById('root'),
              timestamp: new Date().toISOString()
            });
          });
        } else {
          console.log('[JWT Auth] DOM already ready', {
            url: window.location.href,
            hasRootElement: !!document.getElementById('root'),
            readyState: document.readyState,
            timestamp: new Date().toISOString()
          });
        }

        // Log when window loads
        window.addEventListener('load', function() {
          console.log('[JWT Auth] Window load event fired', {
            url: window.location.href,
            timestamp: new Date().toISOString()
          });
        });

        console.log('[JWT Auth] Early error handlers installed (before any scripts load)');

        // Intercept fetch requests to log network errors
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
          const url = args[0];
          const options = args[1] || {};

          // Check if cookies will be sent (credentials mode)
          const credentialsMode = options.credentials || 'same-origin';
          const willSendCookies = credentialsMode === 'include' || (credentialsMode === 'same-origin' && typeof url === 'string' && url.startsWith(window.location.origin));

          console.log('[JWT Auth] Fetch request:', {
            url: typeof url === 'string' ? url : url?.url || url?.toString(),
            method: options.method || 'GET',
            credentials: credentialsMode,
            willSendCookies: willSendCookies,
            isCrossOrigin: typeof url === 'string' ? !url.startsWith(window.location.origin) : false,
            headers: options.headers,
            timestamp: new Date().toISOString(),
          });

          return originalFetch.apply(this, args)
            .then(response => {
              console.log('[JWT Auth] Fetch response:', {
                url: typeof url === 'string' ? url : url?.url || url?.toString(),
                status: response.status,
                statusText: response.statusText,
                ok: response.ok,
                headers: Object.fromEntries(response.headers.entries()),
                timestamp: new Date().toISOString(),
              });
              return response;
            })
            .catch(error => {
              console.error('[JWT Auth] Fetch error:', {
                url: typeof url === 'string' ? url : url?.url || url?.toString(),
                error: error.message,
                errorName: error.name,
                errorStack: error.stack,
                timestamp: new Date().toISOString(),
              });
              // Store fetch errors globally
              window.__LAST_FETCH_ERROR__ = {
                url: typeof url === 'string' ? url : url?.url || url?.toString(),
                error: error.message,
                errorName: error.name,
                timestamp: new Date().toISOString(),
              };
              throw error;
            });
        };

        // Intercept XMLHttpRequest to catch XHR errors
        const originalXHROpen = XMLHttpRequest.prototype.open;
        const originalXHRSend = XMLHttpRequest.prototype.send;

        XMLHttpRequest.prototype.open = function(method, url, ...rest) {
          this._jwtAuthUrl = url;
          this._jwtAuthMethod = method;
          return originalXHROpen.apply(this, [method, url, ...rest]);
        };

        XMLHttpRequest.prototype.send = function(...args) {
          const xhr = this;
          const url = xhr._jwtAuthUrl;
          const method = xhr._jwtAuthMethod;

          // Check if XHR will send cookies (store on xhr object to access in listeners)
          xhr._jwtAuthWillSendCookies = xhr.withCredentials === true;
          xhr._jwtAuthIsCrossOrigin = url && !url.startsWith(window.location.origin);

          console.log('[JWT Auth] XHR request:', {
            url: url,
            method: method,
            withCredentials: xhr.withCredentials,
            willSendCookies: xhr._jwtAuthWillSendCookies,
            isCrossOrigin: xhr._jwtAuthIsCrossOrigin,
            timestamp: new Date().toISOString(),
          });

          xhr.addEventListener('load', function() {
            console.log('[JWT Auth] XHR response:', {
              url: url,
              method: method,
              status: xhr.status,
              statusText: xhr.statusText,
              readyState: xhr.readyState,
              withCredentials: xhr.withCredentials,
              willSendCookies: xhrWillSendCookies,
              isCrossOrigin: xhrIsCrossOrigin,
              timestamp: new Date().toISOString(),
            });
          });

          xhr.addEventListener('error', function() {
            console.error('[JWT Auth] XHR error:', {
              url: url,
              method: method,
              status: xhr.status,
              statusText: xhr.statusText,
              readyState: xhr.readyState,
              withCredentials: xhr.withCredentials,
              willSendCookies: xhr._jwtAuthWillSendCookies,
              isCrossOrigin: xhr._jwtAuthIsCrossOrigin,
              timestamp: new Date().toISOString(),
            });
            window.__LAST_XHR_ERROR__ = {
              url: url,
              method: method,
              status: xhr.status,
              statusText: xhr.statusText,
              withCredentials: xhr.withCredentials,
              willSendCookies: xhr._jwtAuthWillSendCookies,
              isCrossOrigin: xhr._jwtAuthIsCrossOrigin,
              timestamp: new Date().toISOString(),
            };
          });

          xhr.addEventListener('abort', function() {
            console.error('[JWT Auth] XHR aborted:', {
              url: url,
              method: method,
              timestamp: new Date().toISOString(),
            });
          });

          return originalXHRSend.apply(this, args);
        };

        console.log('[JWT Auth] Network interceptors installed (fetch and XHR)');
      })();
    </script>
    <script>
      function isIframed() {
        return window.self !== window.top;
      }
      function addCSSLink(cssUrl) {
        // Create a new link element
        var link = document.createElement('link');

        // Set the attributes for the link element
        link.rel = 'stylesheet';
        link.type = 'text/css';
        link.href = cssUrl;

        // Append the link element to the head
        document.head.appendChild(link);
      }
      function addJSScript(jsUrl) {
        // Check if the page is iframed
        if (isIframed()) {
            console.log("The webpage is iframed.");
        } else {
            console.log("The webpage is not iframed.");
        }

        // Create a new script element
        var script = document.createElement('script');

        // Set the attributes for the script element
        script.type = 'text/javascript';
        script.src = jsUrl;

        // Append the script element to the head
        document.head.appendChild(script);
      }
      if (isIframed()) {
        addCSSLink(`${window.location.origin}/css/mfe.css`);
        addJSScript(`${window.location.origin}/js/mfe.js`);
      }
    </script>
    <% if (htmlWebpackPlugin.options.OPTIMIZELY_PROJECT_ID) { %>
      <script src="https://www.edx.org/optimizelyjs/<%= htmlWebpackPlugin.options.OPTIMIZELY_PROJECT_ID %>.js"></script>
    <% } %>
    <% if (htmlWebpackPlugin.options.META_TAG_ROBOTS_CONTENT_ATTR) { %>
      <meta name="robots" content="<%= htmlWebpackPlugin.options.META_TAG_ROBOTS_CONTENT_ATTR %>">
    <% } %>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
